name: CI

on:
  push:
    paths-ignore:
      - "gallery/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit test (19 test, zero-dependency)
        run: python3 -m unittest discover -s tests -v

      - name: Regenerasi galeri (deterministik)
        run: python3 make_gallery.py

      - name: Commit galeri jika berubah
        run: |
          git config user.name  "lunarjjo-agent"
          git config user.email "313322027+lunarjjo@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "galeri tidak berubah — lewati commit"
          else
            git commit -m "chore: regenerasi galeri [skip ci]"
            git push
          fi
